<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuShare — Secure Document Sharing</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1><span class="docu-word">Docu</span><span class="share-word">Share</span></h1>

        <nav class="nav-bar">
            <a href="{{ url_for('index') }}" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-cloud-arrow-up"></i> <span>Upload</span>
            </a>
            <a href="{{ url_for('download') }}" class="nav-item {% if request.path == '/download' %}active{% endif %}">
                <i class="bi bi-download"></i> <span>Download</span>
            </a>
            <a href="{{ url_for('existing') }}" class="nav-item {% if request.path == '/existing' %}active{% endif %}">
                <i class="bi bi-person"></i> <span>Existing user</span>
            </a>
            <a href="{{ url_for('forget') }}" class="nav-item {% if request.path == '/forget' %}active{% endif %}">
                <i class="bi bi-key"></i> <span>Recover ID</span>
            </a>
        </nav>

        <main class="section-box">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
